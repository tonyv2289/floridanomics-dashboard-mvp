<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pages cannot set custom response headers. This policy protects the document;
         frame-ancestors must be configured at a header-capable host/CDN, not in meta. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://plausible.io; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://plausible.io https://www.google-analytics.com https://region1.google-analytics.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action https://floridanomics.substack.com; frame-src 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Preload the dataset so its download runs in parallel with the JS, not after it. -->
    <link
      rel="preload"
      href="%BASE_URL%data/florida-economy.json"
      as="fetch"
      type="application/json"
      crossorigin="anonymous"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floridanomics Dashboard.</title>
    <meta name="description" content="Florida's economy, explained through employment, investment, trade and regional industry data. Sources and observation dates included." />
    <meta name="theme-color" content="#02060d" />
    <link rel="canonical" href="%VITE_PUBLIC_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Floridanomics Dashboard." />
    <meta property="og:title" content="Floridanomics Dashboard." />
    <meta property="og:description" content="Employment, investment, trade and Florida's regional industries. Current observations, dated benchmarks and clear source notes." />
    <meta property="og:url" content="%VITE_PUBLIC_URL%" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Floridanomics Dashboard." />
    <meta name="twitter:description" content="Employment, investment, trade and Florida's regional industries. Current observations, dated benchmarks and clear source notes." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
