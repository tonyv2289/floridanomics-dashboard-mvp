name: Refresh Data

on:
  schedule:
    # 1st of month: baseline refresh after the BLS metro release window.
    # 18:00 UTC is early afternoon Eastern, so same-day 10 a.m. ET
    # metropolitan releases are available before the pull runs.
    - cron: "0 18 1 * *"
    # 22nd of month: catch the mid-month BLS state employment release
    # (BLS publishes prior-month state data ~3rd week, so this picks it
    # up ~1 week after release instead of waiting for the next 1st)
    - cron: "0 11 22 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Stage a checked branch for the refreshed dataset after reviewing the preview artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh dataset
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: npm run data:refresh

      - name: Validate dataset
        run: npm run data:validate

      - name: Generate what-changed memo
        env:
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || 'https://www.floridanomics.com/' }}
        run: npm run memo:generate

      - name: Snapshot briefing image
        run: bash scripts/snapshot-briefing.sh

      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: floridanomics-data-preview-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            public/data/florida-economy.json
            public/data/what-changed.json
            public/briefings/
            docs/memos/

      - name: Publish approved changes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # -I skips runs where only generatedAt/refreshedAt/retrievedAt
          # timestamps moved, so no-op refreshes stop producing commits
          if git diff --quiet -I'At": "' -- public/data/florida-economy.json; then
            echo "No dataset changes detected."
            exit 0
          fi
          git switch -c "codex/data-refresh-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/florida-economy.json public/data/what-changed.json public/briefings docs/memos
          git commit -m "chore(data): refresh Florida dashboard dataset"
          git push --set-upstream origin HEAD
          # Token-created pushes do not trigger other workflows automatically.
          gh workflow run ci.yml --ref "codex/data-refresh-${{ github.run_id }}"
          gh workflow run security.yml --ref "codex/data-refresh-${{ github.run_id }}"
          echo "Checked update staged for review: https://github.com/${{ github.repository }}/compare/main...codex/data-refresh-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
