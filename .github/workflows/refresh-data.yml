name: Refresh Data

on:
  schedule:
    # Check each weekday after usual morning releases (14:17 EDT / 13:17 EST).
    # Compare observation periods with the live official BLS release calendar.
    # Weekly indicators are checked too; scheduled work never publishes itself.
    - cron: "17 18 * * 1-5"
  workflow_dispatch:
    inputs:
      publish:
        description: Stage a checked branch for the refreshed dataset after reviewing the preview artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: data-review
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh dataset
        id: economic
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: npm run data:refresh

      - name: Check official release calendar
        id: calendar
        continue-on-error: true
        run: npm run data:calendar

      - name: Refresh county jobs and wages
        id: regional
        continue-on-error: true
        run: npm run data:regions

      - name: Validate dataset
        id: validation
        continue-on-error: true
        run: npm run data:validate

      - name: Validate regional data and refresh contracts
        id: contracts
        continue-on-error: true
        run: npm run test && npm run typecheck:scripts

      - name: Reconcile one editorial review alert
        id: review
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_FAILURES: ${{ steps.economic.outcome == 'failure' && 'economic-data,' || '' }}${{ steps.calendar.outcome == 'failure' && 'release-calendar,' || '' }}${{ steps.regional.outcome == 'failure' && 'county-data,' || '' }}${{ steps.validation.outcome == 'failure' && 'data-validation,' || '' }}${{ steps.contracts.outcome == 'failure' && 'refresh-contracts' || '' }}
        run: npm run data:review -- --notify

      - name: Generate what-changed memo
        if: ${{ steps.validation.outcome == 'success' }}
        env:
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || 'https://www.floridanomics.com/' }}
        run: npm run memo:generate

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: floridanomics-data-preview-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            public/data/florida-economy.json
            public/data/what-changed.json
            public/data/regional-economy.json
            public/data/release-calendar.json
            docs/memos/

      - name: Require successful source checks before staging
        if: ${{ steps.economic.outcome == 'failure' || steps.calendar.outcome == 'failure' || steps.regional.outcome == 'failure' || steps.validation.outcome == 'failure' || steps.contracts.outcome == 'failure' }}
        run: exit 1

      - name: Stage reviewed changes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && steps.review.outputs.has_updates == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Semantic comparison ignores build/retrieval stamps, not observation dates.
          git switch -c "codex/data-refresh-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/florida-economy.json public/data/what-changed.json public/data/regional-economy.json public/data/release-calendar.json docs/memos
          git commit -m "chore(data): refresh Florida dashboard dataset"
          git push --set-upstream origin HEAD
          # Token-created pushes do not trigger other workflows automatically.
          gh workflow run ci.yml --ref "codex/data-refresh-${{ github.run_id }}"
          gh workflow run security.yml --ref "codex/data-refresh-${{ github.run_id }}"
          echo "Checked update staged for review: https://github.com/${{ github.repository }}/compare/main...codex/data-refresh-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
