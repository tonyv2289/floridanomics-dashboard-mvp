name: Refresh Policy Watch

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit and deploy the policy update after reviewing the preview artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  refresh-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Florida policy watch list
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: npm run data:legiscan

      - name: Validate application
        run: npm run build

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: floridanomics-policy-preview-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: public/data/policy-watch.json

      - name: Publish approved policy file
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/policy-watch.json; then
            echo "No policy-watch changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/policy-watch.json
          git commit -m "chore(policy): refresh Florida watch list"
          git push
          gh workflow run deploy-pages.yml --ref main
