name: Refresh Policy Watch

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Florida policy watch list
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: npm run data:legiscan

      - name: Validate application
        run: npm run build

      - name: Publish reviewed policy file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/policy-watch.json; then
            echo "No policy-watch changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/policy-watch.json
          git commit -m "chore(policy): refresh Florida watch list"
          git push
          gh workflow run deploy-pages.yml --ref main
