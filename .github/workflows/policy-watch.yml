name: Refresh Policy Watch

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Stage a checked branch for the policy file after reviewing the preview artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  refresh-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Florida policy watch list
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: npm run data:legiscan

      - name: Validate application
        run: npm run build

      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: floridanomics-policy-preview-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: public/data/policy-watch.json

      - name: Publish approved policy file
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/policy-watch.json; then
            echo "No policy-watch changes detected."
            exit 0
          fi
          git switch -c "codex/policy-refresh-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/policy-watch.json
          git commit -m "chore(policy): refresh Florida watch list"
          git push --set-upstream origin HEAD
          # Token-created pushes do not trigger other workflows automatically.
          gh workflow run ci.yml --ref "codex/policy-refresh-${{ github.run_id }}"
          gh workflow run security.yml --ref "codex/policy-refresh-${{ github.run_id }}"
          echo "Checked update staged for review: https://github.com/${{ github.repository }}/compare/main...codex/policy-refresh-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
